toolchain:
  - name: MUSL toolchain optimize by t-head
    id: musl_t-head
    arch: riscv64
    libc: musl
    default: true
    url: https://sophon-file.sophon.cn/sophon-prod-s3/drive/23/03/07/16/host-tools.tar.gz
    urls:
    sites:
      - https://github.com/sophgo/cvi_mmf_sdk
    sha256sum: ff9a58e8e192b20ea42e1d729c42d2219523209706cb3f0cf134582f6c70f805
    filename: host-tools.tar.gz
    path: toolchains/maixcam
    bin_path: toolchains/maixcam/host-tools/gcc/riscv64-linux-musl-x86_64/bin
    prefix: riscv64-unknown-linux-musl-
    c_flags: -mcpu=c906fdv -march=rv64imafdcv0p7xthead -mcmodel=medany -mabi=lp64d
    cxx_flags: -mcpu=c906fdv -march=rv64imafdcv0p7xthead -mcmodel=medany -mabi=lp64d

  # MaixCAM arm64 (zonhor-sg2000 glibc). Toolchain lives in repo-root MaixArm64Host/
  # (synced by scripts/sync_maixcam_arm64_sdk.sh). Do NOT reuse maixcam2/rk3566 paths.
  - name: GLIBC aarch64 toolchain (Linaro 7.3.1, MaixArm64Host)
    id: arm64_glibc_linaro73
    arch: arm64
    libc: glibc
    default: false
    url:
    urls:
    sites:
      - https://www.linaro.org/downloads/
    sha256sum:
    filename:
    path:
    # Resolved relative to repository root (parent of MaixCDK/), not dl/extracted
    path_base: repo_root
    bin_path: MaixArm64Host/toolchain/gcc-linaro-7.3.1-2018.05-x86_64_aarch64-linux-gnu/bin
    prefix: aarch64-linux-gnu-
    c_flags: ""
    cxx_flags: ""

